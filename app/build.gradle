plugins {
    id 'com.android.application'
}

// Each GitHub build gets a higher version number so the phone accepts it as an update.
def runNumber = System.getenv("GITHUB_RUN_NUMBER")

android {
    namespace 'com.onlypanels.singingbalances'
    compileSdk 36

    defaultConfig {
        applicationId "com.showfee.app"
        minSdk 26
        targetSdk 36
        versionCode runNumber ? runNumber.toInteger() : 1
        versionName "1.0." + (runNumber ?: "0")
    }

    // Fixed signing key so every new build installs as an update and keeps your data.
    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'singing-balances'
            keyAlias 'singing'
            keyPassword 'singing-balances'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Google sign-in, used only to send invoices and reminders from the user's own Gmail
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    // Microsoft sign-in, used only to send invoices and reminders from the user's own Outlook / Hotmail
    implementation 'com.microsoft.identity.client:msal:8.+'
    // QR codes for the pay-now link on invoices (works offline, no internet needed)
    implementation 'com.google.zxing:core:3.5.3'
    // Google Play in-app updates: the "new version available" bar
    implementation 'com.google.android.play:app-update:2.1.0'
    // Google Play subscriptions: ShowFee Pro
    implementation 'com.android.billingclient:billing:8.0.0'
}
