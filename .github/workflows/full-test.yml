name: Full button test

on:
  push:
    branches: [full-test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build test app
        run: gradle assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on virtual phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Pinned: Google's listed default emulator download (16428233) returns "not found" as of 1 Oct 2026
          emulator-build: 16433917
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: if [ -f .github/uitest/QUICK ]; then bash .github/uitest/quick.sh; else bash .github/uitest/full.sh; fi

      - name: Save results to branch full-results
        if: always()
        run: |
          mkdir -p /tmp/r && cp -r full-results/. /tmp/r/ 2>/dev/null || true
          git config user.name "ui-test"
          git config user.email "ui-test@users.noreply.github.com"
          git checkout --orphan full-results
          git rm -rfq . || true
          rm -rf ./* .github 2>/dev/null || true
          cp -r /tmp/r/. .
          echo "run ${{ github.run_number }} ${{ github.sha }}" > RUN.txt
          git add -A
          git commit -qm "UI test results run ${{ github.run_number }}"
          git push -f origin full-results
